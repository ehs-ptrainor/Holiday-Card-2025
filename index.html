<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Holiday Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main id="stage">
    <!-- Helper Hint -->
    <div id="ui-hint" class="fade-in">
      <div class="hand-icon">👆</div>
      <p>Tap to open</p>
    </div>

    <div id="book-container"></div>

    <div id="controls">
      <button id="prev" type="button" aria-label="Previous Page">◀</button>
      <button id="open" type="button">Open Card</button>
      <button id="next" type="button" aria-label="Next Page">▶</button>
    </div>
  </main>

  <script src="js/vendor/page-flip.browser.js"></script>
  <script src="js/pageflip.js"></script>
</body>
</html>
